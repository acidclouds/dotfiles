[[mgr.prepend_keymap]]
on = "!"
run = 'shell "$SHELL" --block'
desc = "Open shell here"

[[mgr.prepend_keymap]]
on = "<F2>"
run = "plugin toggle-pane min-parent"
desc = "Toggle the parent pane"

[[mgr.prepend_keymap]]
on = "<F3>"
run = "plugin toggle-pane min-preview"
desc = "Toggle the preview pane"

[[mgr.prepend_keymap]]
on   = "F"
run  = "filter --smart"
desc = "Filter"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin augment-command.enter"
desc = "Enter a directory and skip directories with only a single subdirectory"

[[mgr.prepend_keymap]]
on = "<RIGHT>"
run = "plugin augment-command.enter"
desc = "Enter a directory and skip directories with only a single subdirectory"

[[mgr.prepend_keymap]]
on = "<ENTER>"
run = "plugin augment-command.enter"
desc = "Enter a directory and skip directories with only a single subdirectory"

[[mgr.prepend_keymap]]
on = "o"
run = "disable"
desc = ""

[[mgr.prepend_keymap]]
on = ":"
run = "disable"
desc = ""

[[mgr.prepend_keymap]]
on   = [ "g", "w" ]
run  = "cd ~/Work"
desc = "Cd to ~/Work"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/Personal"
desc = "Cd to ~/Personal"

[[mgr.prepend_keymap]]
on   = [ "g", "b" ]
run  = "cd ~/Brain"
desc = "Cd to ~/Brain"


[[mgr.prepend_keymap]]
on   = [ "<C-;>" ]
run  = "shell --block --interactive"
desc = "Run a shell command blocking. ($0 - hovered, $n - N-th selected, $@ - all selected)"

[[mgr.prepend_keymap]]
on   = [ "<C-:>" ]
run  = "shell --interactive"
desc = "Run a shell command. ($0 - hovered, $n - N-th selected, $@ - all selected)"

[[mgr.prepend_keymap]]
on   = "<C-k>"
run  = "mgr:seek -5"
desc = ""

[[mgr.prepend_keymap]]
on   = "<C-j>"
run  = "mgr:seek 5"
desc = ""

[[mgr.prepend_keymap]]
on   = [ "c", "z", "a" ]
run  = "plugin compress zip"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "z", "p" ]
run  = "plugin compress '-p zip'"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = [ "c", "t", "a" ]
run  = "plugin compress tar.gz"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "t", "p" ]
run  = "plugin compress '-p tar.gz'"
desc = "Archive selected files (password)"

[[input.prepend_keymap]]
on   = "<Up>"
run  = "mgr:arrow prev"
desc = ""

[[input.prepend_keymap]]
on   = "<Down>"
run  = "mgr:arrow next"
desc = ""

